<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Workspace schematic</title>
<style>
:root {
  --paper: #fbfbf7; --panel: #f4f1e8; --mist: #ece9df; --ink: #101010; --muted: #5f6670; --line: #d6d2c8;
  --gun: #25292b; --gun-ink: #f7f2e8; --gun-muted: #b9b7b0;
  --ok: #004225; --ok-soft: #e3ece6;
  --bad: #b3482d; --bad-deep: #681f1b; --bad-soft: #f6e5df;
  --ask: #163d5a; --ask-soft: #dbe7ef;
  --off: #6f716e; --off-soft: #ece9df;
  --sans: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #111111; --panel: #181818; --mist: #222222; --ink: #f7f2e8; --muted: #b8b0a3; --line: #343434;
    --gun: #1b1e1f; --gun-ink: #f7f2e8; --gun-muted: #8f918e;
    --ok: #86c5a2; --ok-soft: #12261c;
    --bad: #ee8a6c; --bad-deep: #f3b19c; --bad-soft: #2e1812;
    --ask: #9cc6e2; --ask-soft: #10222f;
    --off: #9a9c98; --off-soft: #222222;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 64px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
button { font: inherit; color: inherit; }
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-size: 0.86em; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }

/* bar */
.bar { position: sticky; top: 0; z-index: 5; background: var(--gun); color: var(--gun-ink); border-bottom: 1px solid #000; }
.bar .wrap { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.bar b { font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
.bar .sp { flex: 1; }
.seg { display: inline-flex; border: 1px solid #4a4f52; border-radius: 999px; padding: 2px; }
.seg button { white-space: nowrap; border: 0; background: transparent; color: var(--gun-muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; min-height: 32px; }
.seg button[aria-pressed="true"] { background: var(--gun-ink); color: #111; font-weight: 600; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--ask); outline-offset: 2px; }

/* title block */
.title { background: var(--gun); color: var(--gun-ink); padding: 34px 0 30px; }
.title h1 { font-size: clamp(34px, 6vw, 60px); line-height: 0.98; margin: 0 0 14px; font-weight: 800; letter-spacing: -0.03em; }
.title p { font: 21px/1.35 var(--serif); margin: 0; max-width: 34em; color: #e8e2d6; }
.title p em { font-style: normal; border-bottom: 2px solid #d9694b; }
.plate { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 26px; border: 1px solid #4a4f52; border-radius: 8px; overflow: hidden; }
.plate div { padding: 10px 14px; border-right: 1px solid #4a4f52; min-width: 0; }
.plate div:last-child { border-right: 0; }
.plate span { display: block; font: 11px/1.4 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gun-muted); }
.plate strong { font: 500 14px/1.4 var(--mono); overflow-wrap: anywhere; }

section { padding: 34px 0 6px; }
h2 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; font-family: var(--mono); font-weight: 500; color: var(--muted); margin: 0 0 14px; }
h3 { font-size: 26px; letter-spacing: -0.02em; margin: 0; font-weight: 800; }
.lede { color: var(--muted); margin: -6px 0 16px; max-width: 46em; }

/* legend */
.legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.legend div { padding: 12px 14px; border-right: 1px solid var(--line); background: var(--panel); }
.legend div:last-child { border-right: 0; }
.legend p { margin: 6px 0 0; font-size: 14px; color: var(--muted); line-height: 1.4; }

/* status tag */
.tag { display: inline-flex; align-items: center; gap: 5px; font: 500 12px/1 var(--mono); padding: 5px 8px 5px 6px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.tag .i { width: 13px; height: 13px; stroke-width: 2.2; }
.s-matches { color: var(--ok); background: var(--ok-soft); }
.s-change, .s-not-on-disk { color: var(--bad-deep); background: var(--bad-soft); border-color: var(--bad); }
.s-decide { color: var(--ask); background: var(--ask-soft); }
.s-not-checked, .s-optional { color: var(--off); background: var(--off-soft); }

/* summary */
.sum { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sum a { display: grid; grid-template-columns: minmax(150px, 1.1fr) 2fr 2fr 24px; gap: 18px; align-items: center; padding: 14px 16px; color: inherit; text-decoration: none; border-top: 1px solid var(--line); }
.sum a:first-child { border-top: 0; }
.sum a:hover { background: var(--panel); }
.sum .name { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; min-width: 0; }
.sum .name span { overflow-wrap: anywhere; }
.sum .cell small { display: block; font: 11px/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.nums { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; }
.nums b { font-weight: 700; }
.n-ok b { color: var(--ok); } .n-bad b { color: var(--bad); } .n-ask b { color: var(--ask); } .n-off b { color: var(--off); }
.meter { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--mist); margin-top: 7px; }
.meter i { display: block; height: 100%; }
.m-ok { background: var(--ok); } .m-bad { background: var(--bad); } .m-ask { background: var(--ask); } .m-off { background: var(--off); opacity: 0.5; }
.go { color: var(--muted); }

/* workspace */
details.ws { border-top: 2px solid var(--ink); margin-top: 26px; }
details.ws > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 16px 0; flex-wrap: wrap; }
details.ws > summary::-webkit-details-marker, details.mod > summary::-webkit-details-marker { display: none; }
details.ws > summary .chev, details.mod > summary .chev { transition: transform 0.15s; color: var(--muted); }
details[open] > summary .chev { transform: rotate(90deg); }
details.ws > summary .nums { margin-left: auto; font-size: 14px; }
.part { margin: 4px 0 30px; }
.part-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
.part-head h4 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.part-head p { margin: 0; color: var(--muted); font-size: 14px; }
.pair { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.col { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-width: 0; }
.col > header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font: 500 12px/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
.col > header small { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--muted); font-size: 12px; }
.switch { display: none; margin: 0 0 12px; }
.switch .seg { border-color: var(--line); }
.switch .seg button { color: var(--muted); }
.switch .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* tree */
.tree { padding: 4px 0 8px; }
.grp { font: 11px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 14px 14px 6px; }
.ln { padding: 7px 14px; border-top: 1px solid transparent; }
.ln + .ln { border-top-color: color-mix(in srgb, var(--line) 55%, transparent); }
.ln .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ln .nm { font: 500 14px/1.3 var(--mono); overflow-wrap: anywhere; min-width: 0; }
.ln .ct { color: var(--muted); font-size: 13px; white-space: nowrap; }
.ln .home { margin-left: auto; color: var(--muted); font: 12px/1.3 var(--mono); text-align: right; overflow-wrap: anywhere; min-width: 0; }
.ln .row > .tag { margin-left: auto; }
.ln .row > .home + .tag { margin-left: 4px; }
.ln.d1 { padding-left: 38px; } .ln.d2 { padding-left: 62px; }
.ln.d1 .row::before, .ln.d2 .row::before { content: ""; width: 10px; height: 1px; background: var(--line); margin-left: -14px; flex: none; }
.ln.bad { background: var(--bad-soft); box-shadow: inset 3px 0 0 var(--bad); }
.ln.ask { box-shadow: inset 3px 0 0 var(--ask); }
.ln.quiet .nm, .ln.quiet .i { color: var(--off); }
details.more > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 6px 14px 8px 38px; font-size: 13px; color: var(--muted); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary .chev { transition: transform 0.15s; }
details.more { border-top: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.ln.nest { padding-top: 4px; padding-bottom: 4px; }
.ln.nest .nm { font-weight: 400; font-size: 13px; }
.ln.nest .why { font-size: 13px; }
.why { margin: 5px 0 1px 24px; font-size: 14px; line-height: 1.45; }
.why .to { font: 500 13px/1.4 var(--mono); display: flex; align-items: center; gap: 5px; margin-bottom: 2px; overflow-wrap: anywhere; }
.why .dm { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
.rule { font: 12px/1 var(--mono); border: 1px solid currentColor; background: transparent; border-radius: 5px; padding: 4px 6px; margin: 2px 4px 2px 0; cursor: pointer; opacity: 0.85; }
.rule:hover { opacity: 1; }
.rule-note { display: block; font-size: 13px; margin-top: 4px; padding: 6px 8px; border-left: 2px solid currentColor; background: color-mix(in srgb, var(--paper) 70%, transparent); }

/* tables */
details.mod { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin-bottom: 10px; overflow: hidden; }
details.mod > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 11px 14px; flex-wrap: wrap; }
details.mod > summary b { font-size: 16px; }
details.mod > summary .tier { font: 12px/1 var(--mono); color: var(--muted); }
details.mod > summary .nums { margin-left: auto; font-size: 13px; }
.tb { width: 100%; border-collapse: collapse; font-size: 14px; }
.tb th { font: 500 11px/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--mist); }
.tb td { padding: 8px 14px; border-top: 1px solid color-mix(in srgb, var(--line) 55%, transparent); vertical-align: top; }
.tb td.nm { font: 500 13.5px/1.35 var(--mono); overflow-wrap: anywhere; }
.tb td.nm .row { display: flex; gap: 8px; align-items: flex-start; }
.tb td.nm .i { margin-top: 2px; color: var(--muted); }
.tb tr.coll td { font: 11px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding-top: 14px; border-top: 1px solid var(--line); }
.tb tr.bad td { background: var(--bad-soft); }
.tb tr.bad td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
.tb td.num { white-space: nowrap; color: var(--muted); }
.tb td.st { text-align: right; white-space: nowrap; }
.tb .why { margin-left: 24px; font-family: var(--sans); font-weight: 400; }
.install { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; background: var(--panel); }
.install.bad { background: var(--bad-soft); border-color: var(--bad); }
.install .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.install .row .tag { margin-left: auto; }
.install .why { margin-left: 24px; }
.plain { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 26px; margin: 0 0 14px; font-size: 15px; }
.facts b { font-family: var(--mono); font-weight: 500; }
footer { margin-top: 44px; padding: 26px 0 60px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
footer table { border-collapse: collapse; margin-top: 8px; }
footer td { padding: 2px 16px 2px 0; vertical-align: top; overflow-wrap: anywhere; }
.empty { padding: 18px 14px; color: var(--muted); }
body.breaks-only .hide-ok { display: none; }

@media (min-width: 861px) {
  .tb { table-layout: fixed; }
  .tb th:nth-child(2) { width: 170px; } .tb th:nth-child(3) { width: 130px; } .tb th:nth-child(4) { width: 250px; } .tb th:nth-child(5) { width: 170px; }
}
@media (max-width: 860px) {
  .wrap { padding: 0 14px; }
  .bar b { font-size: 14px; }
  .seg button { padding: 6px 10px; font-size: 13px; }
  .plate { grid-template-columns: 1fr 1fr; }
  .plate div:nth-child(2) { border-right: 0; }
  .plate div:nth-child(-n+2) { border-bottom: 1px solid #4a4f52; }
  .legend { grid-template-columns: 1fr 1fr; }
  .legend div:nth-child(2) { border-right: 0; }
  .legend div:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .sum a { grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .sum .name { grid-column: 1 / -1; }
  .sum .go { display: none; }
  .pair { grid-template-columns: 1fr; }
  .switch { display: block; }
  .pair[data-show="as-is"] .col.model, .pair[data-show="model"] .col.as-is { display: none; }
  details.ws > summary .nums { margin-left: 0; width: 100%; }
  .ln .home { display: none; }
  .ln .row > .home + .tag { margin-left: auto; }
  .ln.d1 { padding-left: 30px; } .ln.d2 { padding-left: 46px; }
  .tb thead { display: none; }
  .tb, .tb tbody, .tb tr, .tb td { display: block; width: 100%; }
  .tb tr { border-top: 1px solid color-mix(in srgb, var(--line) 55%, transparent); padding: 8px 14px 9px 38px; position: relative; }
  .tb td { border: 0; padding: 0; }
  .tb td.nm .row { margin-left: -24px; padding-right: 118px; }
  .tb .why { margin-left: 0; }
  .tb td.st { position: absolute; top: 8px; right: 14px; width: auto; }
  .tb td.num { display: inline; white-space: normal; font-size: 13px; }
  .tb td.num[data-l]::before { content: attr(data-l) " "; color: var(--ink); }
  .tb td.num + td.num::before { content: " · "; }
  .tb td.num + td.num[data-l]::before { content: " · " attr(data-l) " "; color: var(--ink); }
  .tb td.num[data-empty] { display: none; }
  .tb tr.coll { padding: 12px 14px 6px; border-top: 1px solid var(--line); }
  .tb tr.coll td { border: 0; padding: 0; }
  .tb tr.bad { background: var(--bad-soft); box-shadow: inset 3px 0 0 var(--bad); }
  .tb tr.bad td, .tb tr.bad td:first-child { background: transparent; box-shadow: none; }
  .tb td.nm { min-height: 28px; }
  .title { padding: 24px 0 22px; }
  .title p { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<div class="bar"><div class="wrap">
  <b>Workspace schematic</b><span class="sp"></span>
  <div class="seg" role="group" aria-label="Which lines to show">
    <button type="button" id="show-all" aria-pressed="true">All lines</button>
    <button type="button" id="show-breaks" aria-pressed="false">Breaks only</button>
  </div>
</div></div>

<header class="title"><div class="wrap">
  <h1>Workspace schematic</h1>
  <p>Each workspace as it is, beside what the model says. Folders on disk. Tables in the database. <em>Red marks a break</em>, with the decision it breaks.</p>
  <div class="plate" id="plate"></div>
</div></header>

<main class="wrap" id="main">
  <noscript><p class="empty">This page draws its data with a script. Turn scripts on for local files.</p></noscript>
</main>

<script id="schematic-data" type="application/json">__SCHEMATIC_JSON__</script>
<script>
(function () {
  "use strict";
  var main = document.getElementById("main");
  var data;
  try { data = JSON.parse(document.getElementById("schematic-data").textContent); }
  catch (error) { main.appendChild(el("p", { class: "empty" }, "The page data did not load. Run the lint again.")); return; }

  var BREAK = { "change": 1, "not on disk": 1 };
  function num(n) { return Number(n).toLocaleString("en-US"); }
  function plural(n, one, many) { return num(n) + " " + (n === 1 ? one : many); }
  function el(tag, attrs) {
    var node = document.createElement(tag), i, child;
    for (var key in (attrs || {})) { if (attrs[key] !== null && attrs[key] !== undefined) node.setAttribute(key, attrs[key]); }
    for (i = 2; i < arguments.length; i++) {
      child = arguments[i];
      if (child === null || child === undefined || child === false) continue;
      if (Array.isArray(child)) child.forEach(function (c) { if (c) node.appendChild(c); });
      else node.appendChild(typeof child === "object" ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  function icon(name, cls) {
    // The parser gives inline svg its namespace. The name comes from a fixed set.
    var holder = document.createElement("span");
    holder.innerHTML = '<svg class="i' + (cls ? " " + cls : "") + '" aria-hidden="true"><use href="#i-' + String(name).replace(/[^a-z-]/g, "") + '"/></svg>';
    return holder.firstChild;
  }
  function slug(status) { return status.replace(/ /g, "-"); }
  // A status is shown with its exact word. Context goes beside the tag, never in it.
  function tag(status) { return el("span", { class: "tag s-" + slug(status) }, icon(slug(status)), status); }
  function rules(ids) {
