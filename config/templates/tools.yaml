# The tool shelf: one row for each tool, and where each one applies.
# Install copies this file to config/tools.yaml. After install the file is yours.
# owner: product = Foxrun ships the page; an update replaces it. owner: person = your own page.
# why: dependency, needed by <skill>, or recommended.
# applies_to pushes a tool to workspaces, like `where` in config/catalog.yaml for skills:
#   global = every workspace · off = no workspace · [name, name] = those workspaces.
#   A row with no applies_to is off.
# After a change, run: python3 "$HOME/.foxrun/base/make_workspaces_view.py"
# Each workspace's TOOLS.md then lists the tool under "From the shelf".
format: 1
tools:
